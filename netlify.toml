[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Site root. GitHub Pages sets VITE_BASE=/framing-cam/ in its own workflow.
  VITE_BASE = "/"
  # Ask /api/health at runtime. With no LLM_API_KEY the function answers llm:false and the button stays off.
  VITE_CLOUD = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
